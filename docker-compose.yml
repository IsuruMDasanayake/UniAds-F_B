services:
  # Backend PHP-FPM Service
  backend-app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: uniads-backend-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./Backend:/var/www
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=uniadsnew
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - APP_URL=http://localhost:8000
    networks:
      - uniads-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Backend Nginx Service
  backend-web:
    image: nginx:alpine
    container_name: uniads-backend-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./Backend:/var/www
      - ./Backend/docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - uniads-network
    depends_on:
      - backend-app


  # Frontend Service
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: build-stage # Stop at Node stage to run dev server
    container_name: uniads-frontend
    restart: unless-stopped
    volumes:
      - ./Frontend:/app
      - frontend-node-modules:/app/node_modules # Isolated dependencies
    working_dir: /app
    command: npm run dev -- --host
    ports:
      - "3050:5173"
    networks:
      - uniads-network

  # Database Service
  db:
    image: mysql:8.0
    container_name: uniads-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uniadsnew
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - uniads-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      retries: 5
      start_period: 10s

  # phpMyAdmin Service (Optional but helpful)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: uniads-pma
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    networks:
      - uniads-network

  # ChromaDB Service (Vector Database)
  chromadb:
    image: chromadb/chroma:latest
    container_name: uniads-chromadb
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    networks:
      - uniads-network

networks:
  uniads-network:
    driver: bridge

volumes:
  db-data:
  frontend-node-modules:
  chromadb-data:
