services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: laravel
        uid: 1000
    container_name: uniads-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    env_file:
      - .env.docker
    networks:
      - uniads-network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: uniads-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - uniads-network

  db:
    image: mysql:8.0
    container_name: uniads-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: uniads
      MYSQL_USER: IsuruMDasanayake
      MYSQL_PASSWORD: Shyami@4211
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - uniads-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 5
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: uniads-pma
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root1234
    networks:
      - uniads-network

networks:
  uniads-network:
    driver: bridge

volumes:
  db-data:
